name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, lint and unit tests
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --stacktrace

      # Debug builds never run R8, so the shrinker was configured here and never once executed.
      # Without this step, the first time code shrinking runs is release day, which is the worst
      # possible day to learn it removed something the app needed. lintVitalRelease is the
      # release-blocking subset of lint, which debug lint does not cover either.
      - name: Release build (R8 + release-blocking lint)
        run: ./gradlew :app:assembleRelease :app:lintVitalRelease --stacktrace

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  widget-on-android-17:
    # The one check that needs a device: GithubWidgetOnDeviceTest puts the GitHub widget's update
    # through the widget service of the newest Android at its largest, and pushes it over the
    # bitmap cap on purpose to see it fail to draw rather than crash. A small phone because the cap
    # scales with the panel, so that is where it leaves the least room — and where a RemoteViews
    # can carry enough sizes to pass it.
    #
    # Three Android 17 images, because the first one tried loses its system server within seconds
    # of boot on this runner, every time, and nothing in the log said why. fail-fast is off so each
    # says for itself which works; the emulator streams crash-relevant logcat into the job log.
    name: widget-on-android-17 (${{ matrix.image.api }} ${{ matrix.image.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - { api: '37.0', target: google_apis }
          - { api: '37.0', target: google_apis_playstore }
          - { api: '37.1', target: google_apis_ps16k }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Built before the emulator starts, so it is up only for as long as the tests take.
      - name: Build the app and its instrumented tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Widget test on an Android 17 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.image.api }}
          target: ${{ matrix.image.target }}
          arch: x86_64
          profile: small_phone
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -logcat 'AndroidRuntime:E libc:F DEBUG:F Watchdog:W SystemServer:E *:S'
          ram-size: 4096M
          cores: 4
          # One command per line, as the runner executes them. Answering once is not enough: on
          # this image the package and activity services answered two seconds after boot and were
          # gone again thirteen seconds later, when the install needed them. So: wait for them,
          # let the system settle, and wait for them to answer again, boot_completed included in
          # case the system server restarted. The last two lines keep the platform's words for the
          # refusal the overflow test provokes ("used: N, max: M") and whatever crashed.
          script: |
            for i in $(seq 1 90); do adb shell cmd package list packages >/dev/null 2>&1 && adb shell cmd activity get-current-user >/dev/null 2>&1 && echo "services up after $((i * 2))s" && break; sleep 2; done
            sleep 60
            for i in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && adb shell cmd package list packages >/dev/null 2>&1 && adb shell cmd activity get-current-user >/dev/null 2>&1 && echo "services still up after the settle, $((i * 2))s more" && break; sleep 2; done
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
            adb logcat -d | grep -E "exceeds maximum bitmap memory usage" || echo "no refusal in logcat"
            adb logcat -d -b crash | tail -60 || true

      # The connected task can pass having run nothing. AGP 9's test engine logged "AndroidTestRunner
      # failed on emulator-5554 ... Failed to install APK" and still ended BUILD SUCCESSFUL with a
      # report of 0 tests, twice. So the report is read and the job fails unless tests ran, none
      # was skipped (a failed assumption is a skip) and none failed.
      - name: Instrumented test results
        if: always()
        run: |
          python3 - <<'PY'
          import re, sys
          page = open("app/build/reports/androidTests/connected/debug/index.html").read()
          count = {k: re.search(rf'id="{k}">\s*<div class="counter">(\d+)</div>', page) for k in ("tests", "failures", "skipped")}
          count = {k: int(m.group(1)) if m else None for k, m in count.items()}
          print(f"{count['tests']} tests, {count['failures']} failed, {count['skipped']} skipped")
          sys.exit(0 if count["tests"] and count["failures"] == 0 and count["skipped"] == 0 else 1)
          PY

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-17-widget-report-${{ matrix.image.api }}-${{ matrix.image.target }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/
