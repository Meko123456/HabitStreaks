name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, lint and unit tests
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --stacktrace

      # Debug builds never run R8, so the shrinker was configured here and never once executed.
      # Without this step, the first time code shrinking runs is release day, which is the worst
      # possible day to learn it removed something the app needed. lintVitalRelease is the
      # release-blocking subset of lint, which debug lint does not cover either.
      - name: Release build (R8 + release-blocking lint)
        run: ./gradlew :app:assembleRelease :app:lintVitalRelease --stacktrace

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  widget-on-android-17:
    # The one check that needs a device: GithubWidgetOnDeviceTest puts the GitHub widget's update
    # through the widget service of the newest Android at its largest, and pushes it over the
    # bitmap cap on purpose to see it fail to draw rather than crash. A small phone because the cap
    # scales with the panel, so that is where it leaves the least room — and where a RemoteViews
    # can carry enough sizes to pass it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Built before the emulator starts, so it is up only for as long as the tests take.
      - name: Build the app and its instrumented tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Widget test on an Android 17 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: small_phone
          # The second line keeps the platform's own words for the refusal the overflow test
          # provokes, "used: N, max: M", while the emulator is still up to be asked.
          script: |
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
            adb logcat -d | grep -E "exceeds maximum bitmap memory usage" || true

      # A green job says nothing about how many tests ran: an assumption that fails is a skip, not a
      # failure. This puts every result in the log.
      - name: Instrumented test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  outcome = "skipped" if case.find("skipped") is not None else "failed" if case.find("failure") is not None else "passed"
                  print(f"{outcome:8} {case.get('classname').rsplit('.', 1)[-1]}.{case.get('name')} ({case.get('time')}s)")
          PY

      - name: Upload instrumented test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-17-widget-report
          path: app/build/reports/androidTests/connected/
